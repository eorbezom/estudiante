<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Student Management System</title>
        <link rel="stylesheet"
              href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
              integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
              crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark">
            <!-- Brand -->
            <a class="navbar-brand" href="#">Student Management System</a>

            <!-- Toggler/Collapse Button -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar links -->
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/students}">Student Management</a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="container mt-3">
            <div class="row">
                <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
                    <h1 class = "text-center"> Crea Nuevo Estudiante </h1>
                    <div class="card-body">
                    <form th:action="@{/students}" th:object="${student}" method="POST">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" name="firstName" th:field="*{firstName}"
                                   class="form-control"
                                   placeholder="Cutipa" />
                        </div>
                        <div class="form-group">
                            <label>Apellidos</label>
                            <input type="text" name="lastName" th:field="*{lastName}"
                                   class="form-control"
                                   placeholder="Quispe" />
                        </div>                        
                        <div class="form-group">
                            <label>Correo</label>
                            <input type="text" name="email" th:field="*{email}"
                                   class="form-control"
                                   placeholder="cutipa@gmail.com" />
                        </div> 
                        <div class="form-group">
    <label>Coursos</label>
    <div>
        <div th:each="course : ${coursesList}" class="form-check">
            <input type="checkbox" 
                   class="form-check-input"
                   th:field="*{courses}" 
                   th:value="${course.id}"
                   th:id="${'course_' + course.id}" />
            <label class="form-check-label" th:for="${'course_' + course.id}" th:text="${course.name}"></label>
        </div>
    </div>
</div>                        
                        
                        <div class="box-footer">
                            <button type="submit" class="btn btn-primary">Emviar</button>
                        </div>

                    </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
